name: floodsense_citizen
description: FloodSense — Citizen app for Malaysia flood response
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  # Firebase
  firebase_core: ^3.6.0
  cloud_firestore: ^5.4.4
  firebase_auth: ^5.3.1
  firebase_messaging: ^15.1.3
  firebase_storage: ^12.3.2

  # AI
  google_generative_ai: ^0.4.6

  # Camera & images
  image_picker: ^1.1.2

  # Maps & Location (OpenStreetMap — no API key required)
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.2
  permission_handler: ^11.3.1

  # File handling
  path_provider: ^2.1.4

  # UI helpers
  intl: ^0.20.1
  shared_preferences: ^2.5.5
  provider: ^6.1.5+1
  pdf: ^3.12.0
  share_plus: ^12.0.1
  url_launcher: ^6.3.2

  # HTTP client (for AgentService → Python agent server)
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  generate: true
  uses-material-design: true
